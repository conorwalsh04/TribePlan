{% extends "base.html" %}
{% block title %}Edit Mood | TribePlan{% endblock %}
{% block content %}
<h2 class="mb-4">Edit Mood Entry</h2>
<form method="POST">
  <div class="mb-3">
    <label class="form-label">Mood (1–5)</label>
    <input type="number" min="1" max="5" class="form-control" name="mood" value="{{ log.mood }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Journal</label>
    <textarea class="form-control" name="journal" rows="3">{{ log.journal }}</textarea>
  </div>
  <button type="submit" class="btn btn-primary">Save Changes</button>
  <a href="{{ url_for('mood') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}

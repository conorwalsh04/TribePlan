{% extends "base.html" %}
{% block title %}Edit Workout | TribePlan{% endblock %}
{% block content %}
<div class="container mt-4">
  <h2 class="mb-4">Edit Workout Entry</h2>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Exercise</label>
      <input
        type="text"
        class="form-control"
        name="exercise"
        value="{{ log.exercise }}"
        required
      >
    </div>

    <div class="mb-3">
      <label class="form-label">Duration (minutes)</label>
      <input
        type="number"
        class="form-control"
        name="duration"
        value="{{ log.duration }}"
        required
      >
    </div>

    <div class="mb-3">
      <label class="form-label">Notes</label>
      <textarea
        class="form-control"
        name="notes"
        rows="3"
      >{{ log.notes }}</textarea>
    </div>

    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{{ url_for('fitness') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}

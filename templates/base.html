<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TribePlan{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo-light.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Background Video (global for all pages) -->
    <div class="bg-video">
        <video autoplay muted loop playsinline>
            <source src="{{ url_for('static', filename='img/demo-screen.mp4') }}" type="video/mp4" />
        </video>
    </div>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand d-flex align-items-center" href="{% if session.get('user_id') %}{{ url_for('home') }}{% else %}{{ url_for('login') }}{% endif %}">
        <img src="{{ url_for('static', filename='img/logo-horizontal.png') }}" alt="TribePlan" height="40">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}">Home</a></li>
            {% if session.get('user_id') %}
            <li class="nav-item"><a class="nav-link" href="{{ url_for('mood') }}">Mood</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('fitness') }}">Fitness</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('food') }}">Food</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('profile') }}">Profile</a></li>
            {% endif %}

            {% if session.get('user_id') %}
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
                </li>
            {% else %}
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('login') }}">Login</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('register') }}">Register</a>
                </li>
            {% endif %}
        </ul>
    </div>
</nav>


    <!-- Page Content -->
    <main class="container my-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-muted py-4">
        <img src="{{ url_for('static', filename='img/logo-light.png') }}" alt="TribePlan" height="30" class="mb-2"><br>
        <small>&copy; TribePlan 2026</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
